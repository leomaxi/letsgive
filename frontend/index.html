<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Let's Give</title>
    <script>
      // Runs before first paint so the dark class is already correct --
      // otherwise the page would flash light before React/ThemeProvider
      // mount and apply it.
      (function () {
        try {
          var stored = localStorage.getItem("letsgive.theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* localStorage/matchMedia unavailable -- fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
